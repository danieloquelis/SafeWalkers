<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SafeWalkers Live Video</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta
      name="description"
      content="SafeWalkers emergency live video session powered by Agora.io"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="experience">
      <div class="video-stage">
        <div id="remote-player" class="video-surface">
          <div class="video-loading" id="remoteLoading">
            Connecting to SafeWalker video…
          </div>
        </div>

        <div class="local-picture">
          <div class="local-label">You</div>
          <div id="local-player" class="local-video">
            <div class="video-loading">Camera preview</div>
          </div>
        </div>

        <div class="map-overlay">
          <div id="map" class="map"></div>
          <button id="navigateBtn" class="cta-button">Take me to them</button>
        </div>
      </div>

      <div class="status-hud">
        <div class="session-chip">
          <span class="label">Session</span>
          <span id="sessionLabel">–</span>
        </div>
        <div id="pusherStatus" class="pusher-status">
          Waiting for location updates…
        </div>
      </div>
    </div>

    <!-- External SDKs -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-sA+4J2Czor8zY6GOGa1t9l9a7L2R6VQvM8H+4bPmT50="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-vEOZm5QdpfQ5sGJZ1b93I7RkGhB7xZ1C7u9qA6lt6nM="
      crossorigin=""
    ></script>
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
